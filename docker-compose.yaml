services:
    backend:
        build: .
        ports: 
            - "3000:3000"
    db:
        image: postgres:latest
        networks:
            default: null
        environment:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
        volumes:
            - type: volume
              source: db_data
              target: /var/lib/postgresql/data
              volume: {}
networks:
    default:
        name: docker_default
volumes:
    db_data:
        name: docker_db_data
